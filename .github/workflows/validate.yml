name: Validate
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Profiles and overlays only use real convars
        run: python tools/validate.py
      - name: Generated card files are up to date
        run: python tools/gen_cards.py --check
